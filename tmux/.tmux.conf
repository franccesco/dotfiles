# ~/.tmux.conf

# Change prefix to Ctrl+Space (triggered by Cmd+p via Ghostty)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g extended-keys on             # Prime agent requirement
set -g extended-keys-format csi-u   # same

# Allow OSC escape sequences to pass through to the outer terminal
set -g allow-passthrough on

# Fix Vim ESC delay
set -sg escape-time 0

# Massive scrollback buffer (effectively unlimited)
set -g history-limit 1000000

# Start windows/panes at 1 (easier to reach)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed (no gaps)
set -g renumber-windows on

# Enable mouse (scrolling, pane selection, resizing)
set -g mouse on

# Use terminal's native scrollback (scroll works like normal terminal)
set -ga terminal-overrides ',*:smcup@:rmcup@'

# Better mouse mode settings
set -g @scroll-without-changing-pane on
set -g @emulate-scroll-for-no-mouse-alternate-buffer on

# Proper colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ─────────────────────────────────────────────────────────────
# THEME: Minimal Ghost (blends into background)
# ─────────────────────────────────────────────────────────────

# Status bar - use terminal default background
set -g status-position bottom
set -g status-style "bg=default,fg=#3b4261"
set -g status-justify left
set -g status-interval 1

# Left: session name
set -g status-left-length 40
set -g status-left "#[fg=#737aa2]#S #[fg=#3b4261]│ "

# Right: status items (claude, now playing, docker) + time
set -g status-right-length 150
set -g status-right "#(~/.local/bin/tmux-status-items.sh #{pane_id}) #[fg=#565f89]#{?client_prefix,#[fg=#737aa2]• ,}%H:%M "

# Windows: muted inactive, readable active
set -g window-status-format "#[fg=#565f89]#I:#W "
set -g window-status-current-format "#[fg=#a9b1d6]#I:#W "
set -g window-status-separator ""

# Pane borders: barely visible
set -g pane-border-style "fg=#2a2e3f"
set -g pane-active-border-style "fg=#3b4261"

# Messages: subtle
set -g message-style "bg=default,fg=#565f89"
set -g message-command-style "bg=default,fg=#565f89"

# Copy mode: subtle highlight
set -g mode-style "bg=#2a2e3f,fg=#7aa2f7"

# Clock
set -g clock-mode-colour "#565f89"

# Bell: only thing that pops
set -g window-status-bell-style "fg=#f7768e"

# Easier splits (more intuitive keys)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows open in current path
bind c new-window -c "#{pane_current_path}"

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Move windows left/right (Ctrl+Shift+Arrow)
bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1

# Quick window switching (Option + number)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Click on status-right to toggle music
bind-key -n MouseDown1StatusRight run-shell "~/.local/bin/music-toggle.sh"

# Copy to system clipboard (macOS)
set -g set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Set notifications
set -g bell-action any
set -g monitor-bell on
set -g visual-bell off

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'NHDaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize tpm (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
